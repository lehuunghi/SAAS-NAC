name: SAAS-NAC checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: saas_nac_test
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_DATABASE: saas_nac_test
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      REDIS_CLIENT: predis
      SAAS_REDIS_TESTS: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict && composer audit
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: php artisan test
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm audit && npm run build
      - run: pipx install ansible-core==2.19.3
      - run: ansible-playbook -i localhost, infrastructure/ansible/install-nac20.yml --syntax-check
      - run: ansible-playbook -i localhost, infrastructure/ansible/check-nac20-host.yml --syntax-check
      - run: SAAS_ANSIBLE_TESTS=true php artisan test --filter=test_real_ansible_preserves_password_as_literal_without_connecting_to_any_server
  containers:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Prepare isolated CI configuration
        run: |
          cp .env.example .env
          printf '\nAPP_KEY=base64:%s\nDB_PASSWORD=ci-app-only\nMYSQL_ROOT_PASSWORD=ci-root-only\n' "$(openssl rand -base64 32)" >> .env
      - run: docker compose config --quiet && docker compose build
      - run: docker compose up -d mysql redis && docker compose run --rm app php artisan migrate --force
      - run: docker compose up -d
      - name: Verify HTTP page and compiled assets
        run: |
          curl --retry 15 --retry-all-errors --retry-delay 3 --fail http://127.0.0.1:8088/ -o /tmp/nac20.html
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const html = fs.readFileSync('/tmp/nac20.html', 'utf8');
          if (!html.includes('NAC20')) throw new Error('Missing NAC20 page');
          const assets = [...html.matchAll(/(?:src|href)="([^\"]*\/build\/assets\/[^\"]+)"/g)];
          if (assets.length < 2) throw new Error('Missing compiled assets');
          for (const [, asset] of assets) {
            const response = await fetch(new URL(asset).pathname.startsWith('/build/') ? 'http://127.0.0.1:8088' + new URL(asset).pathname : asset);
            if (!response.ok || response.headers.get('content-type')?.includes('text/html')) throw new Error('Asset not served: ' + asset);
          }
          const origin = 'http://127.0.0.1:8088';
          const catalog = await fetch(origin + '/saas/api/v1/catalog', {headers:{Accept:'application/json'}});
          if (!catalog.ok || (await catalog.json()).plans.length !== 3) throw new Error('Catalog API failed');
          const tenant = await fetch(origin + '/saas/api/v1/tenants', {headers:{Accept:'application/json'}});
          if (tenant.status !== 401) throw new Error('Unauthenticated tenant access was not rejected');
          const login = await fetch(origin + '/saas/api/v1/login', {method:'POST', headers:{Accept:'application/json', 'Content-Type':'application/json'}, body:'{}'});
          if (login.status !== 419) throw new Error('Production CSRF protection failed');
          console.log('NAC20 HTTP and assets passed');
          JS
      - name: Stop CI stack
        if: always()
        run: docker compose down
